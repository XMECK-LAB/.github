<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="XMECK-LAB">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="50%" stop-color="#0b1830"/>
      <stop offset="100%" stop-color="#160b28"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlow">
      <stop offset="0%" stop-color="#f97316" stop-opacity=".58"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <circle cx="205" cy="80" r="180" fill="url(#blueGlow)" filter="url(#blur)">
    <animate attributeName="cx" values="205;285;205" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1005" cy="325" r="200" fill="url(#orangeGlow)" filter="url(#blur)">
    <animate attributeName="cx" values="1005;925;1005" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".22" stroke="#93c5fd" fill="none">
    <path d="M90 326 C280 235 392 352 560 258 S895 139 1110 216" stroke-width="1.4">
      <animate attributeName="stroke-dasharray" values="2 18;18 2;2 18" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M95 135 C330 32 470 201 650 118 S910 54 1115 116" stroke-width="1">
      <animate attributeName="stroke-dasharray" values="12 8;2 18;12 8" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(600 168)">
    <circle r="70" fill="#0f1d35" stroke="url(#brand)" stroke-width="2"/>
    <circle r="82" fill="none" stroke="#60a5fa" stroke-opacity=".28">
      <animate attributeName="r" values="76;96;76" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".45;0;.45" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#fb923c">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="82;82" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="3">XMECK</text>
    <text x="0" y="24" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#93c5fd" letter-spacing="6">LAB</text>
  </g>

  <text x="600" y="288" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="url(#brand)">WORKING SOFTWARE · EXPLICIT TRUTH</text>
  <text x="600" y="326" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#cbd5e1" letter-spacing="1.2">PRIVATE INTELLIGENCE  ·  RECONSTRUCTION  ·  GOVERNED EXECUTION  ·  TRUST</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">
    <g transform="translate(160 190)">
      <circle r="8" fill="#60a5fa"><animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/></circle>
      <text x="20" y="5" fill="#dbeafe">INTELLIGENCE</text>
    </g>
    <g transform="translate(184 238)">
      <circle r="8" fill="#38bdf8"><animate attributeName="r" values="10;6;10" dur="3.8s" repeatCount="indefinite"/></circle>
      <text x="20" y="5" fill="#dbeafe">RECONSTRUCTION</text>
    </g>
    <g transform="translate(906 188)">
      <circle r="8" fill="#f59e0b"><animate attributeName="r" values="6;10;6" dur="3.5s" repeatCount="indefinite"/></circle>
      <text x="20" y="5" fill="#ffedd5">EXECUTION</text>
    </g>
    <g transform="translate(934 236)">
      <circle r="8" fill="#fb923c"><animate attributeName="r" values="10;6;10" dur="4.2s" repeatCount="indefinite"/></circle>
      <text x="20" y="5" fill="#ffedd5">TRUST</text>
    </g>
  </g>
</svg>
